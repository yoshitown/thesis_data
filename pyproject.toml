[tool.poetry]
name = "thesis_data"
version = "0.1.0"
description = "Data and scripts for thesis"
authors = ["imagawayoshihito <you@example.com>"]
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
numpy = "*"
pandas = "*"
scipy = "*"
optuna = "<4.0"
scikit-learn = "<1.4"
torch = "^2.9.1"
gpytorch = "^1.15"
botorch = "^0.16.1"
matplotlib = "^3.10.8"
tabulate = "^0.9.0"
japanize-matplotlib = "^1.1.3"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
